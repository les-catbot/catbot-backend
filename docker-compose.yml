services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: catbot
      POSTGRES_PASSWORD: catbot
      POSTGRES_DB: catbot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catbot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
