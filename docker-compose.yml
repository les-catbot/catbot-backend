services:
  app:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    # Executa as migrações (cria as tabelas) e depois sobe a API
    command: sh -c "alembic upgrade head && uvicorn catbot.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - catbot-net

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: catbot
      POSTGRES_PASSWORD: catbot
      POSTGRES_DB: catbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catbot"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - catbot-net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catbot-net

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text && ollama pull llama3.2:1b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      PYTHONPATH : /app/src
    networks:
      - catbot-net

volumes:
  pgdata:
  ollama-data:

networks:
  catbot-net:
    driver: bridge